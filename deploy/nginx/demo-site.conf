# Staging demo — PUBLIC WEBSITE, HTTPS (nginx template; ${...} are filled from the container
# environment at start-up). The website's twin of demo-admin.conf.
#
# DEMO_SITE_HOST (e.g. demo.example.com) is the website's own origin:
#   /api/v1/public/ → Django   the Contact form's only browser call (real client IP for the
#                              per-IP limit, no CORS); NOTHING else under /api/ is routed here
#   everything else → website  (next start)
# Certificate: ONE certificate for both demo hosts, issued by host-level certbot with
#   -d DEMO_HOST -d DEMO_SITE_HOST   → stored under /etc/letsencrypt/live/${DEMO_HOST}/
# The demo copy is never indexed (X-Robots-Tag, robots.txt, and an image built with
# SITE_NOINDEX=1).

# Upstreams are named through variables and looked up with Docker's DNS (re-asked every
# 10 s): when an app container restarts (deploy, restore, reset) it gets a NEW address.
# Plain `upstream` blocks are resolved once at nginx start-up and would keep sending
# traffic to the old address — possibly another service's.

server {
    listen 80;
    server_name ${DEMO_SITE_HOST};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;   # certificate renewals keep working over HTTP
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${DEMO_SITE_HOST};
    resolver 127.0.0.11 valid=10s ipv6=off;   # Docker's embedded DNS
    set $django_api  http://backend:8000;
    set $website     http://website:3000;

    ssl_certificate     /etc/letsencrypt/live/${DEMO_HOST}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DEMO_HOST}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 64k;   # the contact form is the only body this host accepts

    # Every response (add_header in a location replaces these, so they are repeated there).
    add_header Strict-Transport-Security "max-age=${HSTS_SECONDS}" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /robots.txt {
        add_header Strict-Transport-Security "max-age=${HSTS_SECONDS}" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Type text/plain always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Only the public API.
    location /api/v1/public/ {
        proxy_pass $django_api;          # no URI part → path and query unchanged
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_hide_header Strict-Transport-Security;   # nginx sends the one header above
    }
    location /api/ {
        return 404;
    }

    location / {
        proxy_pass $website;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
