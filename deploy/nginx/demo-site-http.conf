# Staging demo — PUBLIC WEBSITE, HTTP BOOTSTRAP (nginx template; ${...} are filled from the
# container environment at start-up). The website's twin of demo-admin-http.conf: used on the
# first deploy (before the certificate exists) and for local smoke tests. After certbot has
# issued the certificate (one certificate for DEMO_HOST + DEMO_SITE_HOST), switch
# NGINX_SITE_WEB to demo-site.conf. See docs/DEPLOYMENT.md §9.
#
# DEMO_SITE_HOST (e.g. demo.example.com) is the website's own origin:
#   /api/v1/public/ → Django   the Contact form's only browser call (real client IP for the
#                              per-IP limit, no CORS); NOTHING else under /api/ is routed here
#   everything else → website  (next start)
# The demo copy is never indexed: X-Robots-Tag here, robots.txt below, and the image itself
# is built with SITE_NOINDEX=1.

# Upstreams are named through variables and looked up with Docker's DNS (re-asked every
# 10 s): when an app container restarts (deploy, restore, reset) it gets a NEW address.
# Plain `upstream` blocks are resolved once at nginx start-up and would keep sending
# traffic to the old address — possibly another service's.

server {
    listen 80;
    server_name ${DEMO_SITE_HOST};
    server_tokens off;  # no nginx version in headers or error pages
    resolver 127.0.0.11 valid=10s ipv6=off;   # Docker's embedded DNS
    set $django_api  http://backend:8000;
    set $website     http://website:3000;

    client_max_body_size 64k;   # the contact form is the only body this host accepts
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /robots.txt {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Type text/plain always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Only the public API.
    location /api/v1/public/ {
        proxy_pass $django_api;          # no URI part → path and query unchanged
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location /api/ {
        return 404;
    }

    location / {
        proxy_pass $website;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
