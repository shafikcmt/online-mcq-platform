# Production — PUBLIC WEBSITE (nginx template; ${...} are filled from the container
# environment at start-up).
#
# SITE_HOST (livemodeltest.com) is the canonical origin; www.SITE_HOST redirects to it.
#   /api/v1/public/ → Django   the Contact form's browser call and the website's server-side
#                              reads; NOTHING else under /api/ is routed here
#   everything else → website  (next start)
# The production website IS indexable: no X-Robots-Tag here; robots.txt and the sitemap come
# from the website itself (built without SITE_NOINDEX).
# Certificate: ONE Let's Encrypt certificate (CERT_NAME) for SITE_HOST, www.SITE_HOST and
# ADMIN_HOST, from host-level certbot (docs/PRODUCTION_DEPLOYMENT.md).

# Upstreams are named through variables and looked up with Docker's DNS (re-asked every
# 10 s): when an app container restarts (deploy, rollback) it gets a NEW address.

# HTTP → HTTPS (both names), certificate renewals over HTTP.
server {
    listen 80;
    server_name ${SITE_HOST} www.${SITE_HOST};
    server_tokens off;  # no nginx version in headers or error pages

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://${SITE_HOST}$request_uri;
    }
}

# https://www → https://apex (one canonical address for search engines).
server {
    listen 443 ssl;
    http2 on;
    server_name www.${SITE_HOST};
    server_tokens off;  # no nginx version in headers or error pages

    ssl_certificate     /etc/letsencrypt/live/${CERT_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${CERT_NAME}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=${HSTS_SECONDS}" always;
    return 301 https://${SITE_HOST}$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${SITE_HOST};
    server_tokens off;  # no nginx version in headers or error pages
    resolver 127.0.0.11 valid=10s ipv6=off;   # Docker's embedded DNS
    set $django_api  http://backend:8000;
    set $website     http://website:3000;

    ssl_certificate     /etc/letsencrypt/live/${CERT_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${CERT_NAME}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 64k;   # the contact form is the only body this host accepts

    # Every response (add_header in a location replaces these, so they are repeated there).
    add_header Strict-Transport-Security "max-age=${HSTS_SECONDS}" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Only the public API.
    location /api/v1/public/ {
        proxy_pass $django_api;          # no URI part → path and query unchanged
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_hide_header Strict-Transport-Security;   # nginx sends the one header above
    }
    location /api/ {
        return 404;
    }

    location / {
        proxy_pass $website;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
