# Staging demo — HTTPS site (nginx template; ${...} are filled from the container
# environment by the official nginx image at start-up).
#
# ONE public host (DEMO_HOST, e.g. demo-admin.example.com) for the panel AND its API:
#   /api/*            → Django (gunicorn)        same origin → no CORS, CSRF via forwarded Host
#   /${DJANGO_ADMIN_URL} → Django internal admin (operations only)
#   /static/  /media/ → shared volumes, read-only (media = staging demo storage only)
#   everything else   → Admin Panel (next start)
# Certificates: host-level certbot (webroot), /etc/letsencrypt mounted read-only.
# Django is reachable only through this proxy (TRUSTED_PROXY_COUNT=1).

upstream django_api   { server backend:8000; }
upstream admin_panel  { server admin:3000; }

server {
    listen 80;
    server_name ${DEMO_HOST};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;   # certificate renewals keep working over HTTP
    }

    # Container health check only (answered on port 80 without redirect or logging).
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${DEMO_HOST};

    ssl_certificate     /etc/letsencrypt/live/${DEMO_HOST}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DEMO_HOST}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 10m;   # question images (QUESTION_IMAGE_MAX_BYTES = 2 MB)

    # Every response (add_header in a location replaces these, so they are repeated there).
    # HSTS starts short on the demo host (HSTS_SECONDS); Django's own header is hidden below
    # so there is exactly one.
    add_header Strict-Transport-Security "max-age=${HSTS_SECONDS}" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /robots.txt {
        add_header Strict-Transport-Security "max-age=${HSTS_SECONDS}" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Type text/plain always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /api/ {
        proxy_pass http://django_api;          # no URI part → path, trailing slash and query unchanged
        proxy_set_header Host              $host;                      # ALLOWED_HOSTS + CSRF origin check
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for; # real client IP appended on the right
        proxy_set_header X-Forwarded-Proto $scheme;                    # SECURE_PROXY_SSL_HEADER
        proxy_hide_header Strict-Transport-Security;
        proxy_read_timeout 60s;
    }

    location /${DJANGO_ADMIN_URL} {
        proxy_pass http://django_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Strict-Transport-Security;
    }

    location /static/ {
        alias /srv/static/;
        limit_except GET HEAD { deny all; }
        autoindex off;
        expires 7d;
        add_header Strict-Transport-Security "max-age=${HSTS_SECONDS}" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Uploaded question images — STAGING DEMO storage (shared volume), not the final
    # production media design (docs/DEPLOYMENT.md §4a).
    location /media/ {
        alias /srv/media/;
        limit_except GET HEAD { deny all; }
        autoindex off;
        expires 7d;
        add_header Strict-Transport-Security "max-age=${HSTS_SECONDS}" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
    }

    location / {
        proxy_pass http://admin_panel;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
