# Production — ADMIN PANEL + API (nginx template; ${...} are filled from the container
# environment at start-up).
#
# ADMIN_HOST (admin.livemodeltest.com) serves the panel AND its API on one origin:
#   /api/*               → Django (gunicorn)   same origin → no CORS; CSRF via forwarded Host
#   /${DJANGO_ADMIN_URL} → Django internal admin (operations only, secret path)
#   /static/  /media/    → shared volumes, read-only
#   everything else      → Admin Panel (next start)
#
# HTTP Basic Auth — an extra lock IN FRONT OF the panel's own sign-in — covers the panel
# pages and the internal Django admin. It deliberately does NOT cover:
#   /api/     the mobile app, payment-gateway callbacks and the panel's own (server-side)
#             API calls must reach it; every API endpoint has its own authentication
#   /media/   question images shown in the mobile app
#   /static/  public CSS/JS of the Django admin (no data)
#   ACME challenge (port 80) — certificate renewals
# Credentials: /srv/mcq/nginx/admin.htpasswd on the server (mounted read-only), created
# there with a hidden prompt (docs/PRODUCTION_DEPLOYMENT.md) — never in the repository.
# Never indexed (X-Robots-Tag on every response, robots.txt disallows everything).
# Certificate: the shared Let's Encrypt certificate CERT_NAME (see prod-site.conf).
# Django is reachable only through this proxy (TRUSTED_PROXY_COUNT=1).

# The Basic Auth password travels in the Authorization header of every browser request to
# this host. Never forward it upstream: strip "Basic …" headers, keep "Bearer …" (the
# mobile app's JWT) unchanged.
map $http_authorization $admin_api_authorization {
    default   $http_authorization;
    "~*^Basic " "";
}

server {
    listen 80;
    server_name ${ADMIN_HOST};
    server_tokens off;  # no nginx version in headers or error pages

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;   # certificate renewals keep working over HTTP
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${ADMIN_HOST};
    server_tokens off;  # no nginx version in headers or error pages
    resolver 127.0.0.11 valid=10s ipv6=off;   # Docker's embedded DNS
    set $django_api  http://backend:8000;
    set $admin_panel http://admin:3000;

    ssl_certificate     /etc/letsencrypt/live/${CERT_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${CERT_NAME}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 10m;   # question images (QUESTION_IMAGE_MAX_BYTES = 2 MB)

    # Every response (add_header in a location replaces these, so they are repeated there).
    # Django's own HSTS header is hidden below so there is exactly one.
    add_header Strict-Transport-Security "max-age=${HSTS_SECONDS}" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /robots.txt {
        add_header Strict-Transport-Security "max-age=${HSTS_SECONDS}" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Type text/plain always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /api/ {
        proxy_pass $django_api;          # no URI part → path, trailing slash and query unchanged
        proxy_set_header Authorization     $admin_api_authorization;   # never the Basic Auth password
        proxy_set_header Host              $host;                      # ALLOWED_HOSTS + CSRF origin check
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for; # real client IP appended on the right
        proxy_set_header X-Forwarded-Proto $scheme;                    # SECURE_PROXY_SSL_HEADER
        proxy_hide_header Strict-Transport-Security;
        proxy_read_timeout 60s;
    }

    location /${DJANGO_ADMIN_URL} {
        auth_basic           "Restricted";
        auth_basic_user_file /etc/nginx/auth/admin.htpasswd;
        proxy_pass $django_api;
        proxy_set_header Authorization     "";   # the Basic Auth password stays in nginx
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Strict-Transport-Security;
    }

    location /static/ {
        alias /srv/static/;
        limit_except GET HEAD { deny all; }
        autoindex off;
        expires 7d;
        add_header Strict-Transport-Security "max-age=${HSTS_SECONDS}" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Uploaded question images (shared volume, preserved across deployments).
    location /media/ {
        alias /srv/media/;
        limit_except GET HEAD { deny all; }
        autoindex off;
        expires 7d;
        add_header Strict-Transport-Security "max-age=${HSTS_SECONDS}" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
    }

    location / {
        auth_basic           "Restricted";
        auth_basic_user_file /etc/nginx/auth/admin.htpasswd;
        proxy_pass $admin_panel;
        proxy_set_header Authorization     "";   # the Basic Auth password stays in nginx
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
