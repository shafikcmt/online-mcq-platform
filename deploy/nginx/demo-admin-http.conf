# Staging demo — HTTP BOOTSTRAP site (nginx template; ${...} are filled from the container
# environment by the official nginx image at start-up). Used ONLY:
#   1. on the first deploy, before a TLS certificate exists, so certbot can answer the
#      ACME HTTP-01 challenge from the webroot; and
#   2. for local smoke tests of the staging stack (with DJANGO_SECURE_SSL_REDIRECT=false).
# It never needs certificate files, so nginx always starts. After the certificate is
# issued, switch NGINX_SITE to demo-admin.conf (HTTPS). See docs/DEPLOYMENT.md §9.

# Upstreams are named through variables and looked up with Docker's DNS (re-asked every
# 10 s): when an app container restarts (deploy, restore, reset) it gets a NEW address.
# Plain `upstream` blocks are resolved once at nginx start-up and would keep sending
# traffic to the old address — possibly another service's.

server {
    listen 80;
    server_name ${DEMO_HOST};
    server_tokens off;  # no nginx version in headers or error pages
    resolver 127.0.0.11 valid=10s ipv6=off;   # Docker's embedded DNS
    set $django_api  http://backend:8000;
    set $admin_panel http://admin:3000;

    client_max_body_size 10m;   # question images (QUESTION_IMAGE_MAX_BYTES = 2 MB)
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Let's Encrypt HTTP-01 challenge (host certbot writes to the shared webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Container health check only (answered on port 80 without redirect or logging).
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    location = /robots.txt {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Type text/plain always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /api/ {
        proxy_pass $django_api;          # no URI part → path, trailing slash and query unchanged
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Internal Django admin (operations only; non-obvious path from DJANGO_ADMIN_URL).
    location /${DJANGO_ADMIN_URL} {
        proxy_pass $django_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /srv/static/;
        limit_except GET HEAD { deny all; }
        autoindex off;
        expires 7d;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Uploaded question images — STAGING DEMO storage (shared volume), not the final
    # production media design (docs/DEPLOYMENT.md §4a).
    location /media/ {
        alias /srv/media/;
        limit_except GET HEAD { deny all; }
        autoindex off;
        expires 7d;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
    }

    location / {
        proxy_pass $admin_panel;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
