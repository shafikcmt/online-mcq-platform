# Production — catch-all servers (nginx template; ${...} are filled from the container
# environment at start-up).
#
# A request for any host that is not ours (the bare IP address, a scanner, a stranger's
# domain pointed at this server) is dropped: no redirect, no page, no certificate shown.
# Also answers the container health check (/nginx-health over plain HTTP on 127.0.0.1).

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;  # no nginx version in headers or error pages

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    location / {
        return 444;   # close the connection without a response
    }
}

server {
    listen 443 ssl default_server;
    server_name _;
    server_tokens off;  # no nginx version in headers or error pages
    ssl_reject_handshake on;   # unknown host name → TLS handshake refused, no certificate sent
}
