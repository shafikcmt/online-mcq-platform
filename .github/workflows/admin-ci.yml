name: Admin Panel CI

on:
  push:
  # Pushes to develop only: main always receives commits that develop already tested, and
  # "Deploy production" runs this same workflow again as its gate before anything is built.
  # Running it a third time on main only spent Actions minutes.
    branches: [develop]
    paths:
      - "admin/**"
      - ".github/workflows/admin-ci.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "admin/**"
      - ".github/workflows/admin-ci.yml"
  # Also run as the test gate of the production deployment (deploy-production.yml).
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the CALLER's name when run by the deployment, so the deployment's
  # test gate never cancels (or is cancelled by) the ordinary CI run of the same push.
  group: ${{ github.workflow }}-admin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and component tests (Vitest)
        run: npm test

      # Production build: no /api proxy is compiled in (nginx routes /api/* in production).
      - name: Production build
        run: npm run build

      # Playwright end-to-end tests need the full stack (Django, PostgreSQL, Redis, nginx) and
      # are run locally/full-stack — see admin/README.md.
